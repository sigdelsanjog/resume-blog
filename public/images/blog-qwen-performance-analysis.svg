<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1e293b"/>
  
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Main content area -->
  <rect x="50" y="50" width="500" height="300" rx="20" fill="url(#bgGradient)" opacity="0.9"/>
  
  <!-- Qwen logo placeholder -->
  <circle cx="150" cy="150" r="60" fill="#f8fafc" opacity="0.2"/>
  <rect x="120" y="120" width="60" height="60" rx="10" fill="#f8fafc" opacity="0.3"/>
  
  <!-- Model information -->
  <text x="300" y="150" font-family="Arial, sans-serif" font-size="24" fill="#f8fafc" text-anchor="middle">
    Qwen3-30B
  </text>
  
  <!-- Memory usage indicator -->
  <rect x="300" y="170" width="200" height="20" rx="10" fill="#3b82f6" opacity="0.7"/>
  <rect x="300" y="170" width="150" height="20" rx="10" fill="#10b981" opacity="0.8"/>
  
  <!-- Memory text -->
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle">
    12-15GB RAM
  </text>
  
  <!-- Device info -->
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" opacity="0.9">
    MacBook M5 Pro
  </text>
  
    <!-- Device info -->
  <text x="300" y="280" font-family="Arial, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" opacity="0.9">
    Local Model Performance Analysis
  </text>
  <!-- Icon elements -->
  <circle cx="450" cy="100" r="20" fill="#f8fafc" opacity="0.3"/>
  <rect x="430" y="80" width="40" height="40" rx="5" fill="#f8fafc" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="300" r="15" fill="#f8fafc" opacity="0.2"/>
  <rect x="80" y="280" width="40" height="40" rx="5" fill="#f8fafc" opacity="0.2"/>
</svg>