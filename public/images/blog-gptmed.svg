<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1e293b"/>
  
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Main content area -->
  <rect x="50" y="50" width="500" height="300" rx="20" fill="url(#bgGradient)" opacity="0.9"/>
  
  <!-- Medical AI icon -->
  <circle cx="150" cy="150" r="60" fill="#f8fafc" opacity="0.2"/>
  <rect x="120" y="120" width="60" height="60" rx="10" fill="#f8fafc" opacity="0.3"/>
  
  <!-- Model information -->
  <text x="300" y="150" font-family="Arial, sans-serif" font-size="24" fill="#f8fafc" text-anchor="middle">
    llm-med
  </text>
  
  <!-- Version indicator -->
  <rect x="300" y="170" width="120" height="20" rx="10" fill="#3b82f6" opacity="0.7"/>
  <rect x="300" y="170" width="80" height="20" rx="10" fill="#10b981" opacity="0.8"/>
  
  <!-- Version text -->
  <text x="360" y="185" font-family="Arial, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle">
    v0.1.0
  </text>
  
  <!-- Medical domain indicator -->
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" opacity="0.9">
    Medical QA Language Model
  </text>
  
  <!-- PyPI indicator -->
  <rect x="400" y="250" width="120" height="30" rx="8" fill="#f8fafc" opacity="0.2"/>
  <text x="460" y="270" font-family="Arial, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">
    Available on PyPI
  </text>
  
  <!-- Icon elements -->
  <circle cx="450" cy="100" r="20" fill="#f8fafc" opacity="0.3"/>
  <rect x="430" y="80" width="40" height="40" rx="5" fill="#f8fafc" opacity="0.3"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="300" r="15" fill="#f8fafc" opacity="0.2"/>
  <rect x="80" y="280" width="40" height="40" rx="5" fill="#f8fafc" opacity="0.2"/>
  
  <!-- Medical cross -->
  <path d="M500,100 L520,100 L520,80 L540,100 L520,120 L520,100 L500,100 Z" fill="#f8fafc" opacity="0.3"/>
</svg>